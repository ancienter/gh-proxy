name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # TEMP(debug): publish failing test output to the ci-log branch
      - name: Run tests
        run: |
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -c 200000 /tmp/test.log > ci-log.txt
            git config user.email "ci@local"
            git config user.name "ci"
            git checkout -B ci-log
            git add -f ci-log.txt
            git commit -m "ci failure log"
            git push -f origin ci-log
          fi
          exit "$status"

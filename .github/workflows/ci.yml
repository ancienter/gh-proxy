name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated types are up to date
        run: |
          npm run cf-typegen
          git diff --exit-code -- worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - name: Validate the Worker build
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-out"

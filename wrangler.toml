#:schema node_modules/wrangler/config-schema.json

name = "gh-proxy"
main = "index.js"
# 设置为当前日期
compatibility_date = "2026-10-13"
workers_dev = true

# 自定义域名，zone 必须在同一账号下
[[routes]]
pattern = "gh-proxy.7s.pub"
custom_domain = true

# 内置主页静态资源（public/），未命中资源的请求交给 Worker 处理
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/*"]

[vars]
# 主页地址，留空使用内置 public/ 资源；填外部地址则回源该地址
ASSET_URL = ""
# 前缀，如果自定义路由为 example.com/gh/*，将 PREFIX 改为 '/gh/'
PREFIX = "/"
# 分支文件使用 jsDelivr 镜像的开关，0 为关闭
JSDELIVR = "0"
# 白名单，逗号分隔，路径中包含任一字符才通过，留空表示不限制
WHITE_LIST = ""

[observability]
enabled = true

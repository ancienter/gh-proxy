#:schema node_modules/wrangler/config-schema.json

name = "gh-proxy"
main = "index.js"
# 设置为当前日期
compatibility_date = "2026-10-13"
workers_dev = true

# 自定义域名，zone 必须在同一账号下
[[routes]]
pattern = "gh-proxy.7s.pub"
custom_domain = true

[vars]
# 静态资源（主页）地址
ASSET_URL = "https://hunshcn.github.io/gh-proxy/"
# 前缀，如果自定义路由为 example.com/gh/*，将 PREFIX 改为 '/gh/'
PREFIX = "/"
# 分支文件使用 jsDelivr 镜像的开关，0 为关闭
JSDELIVR = "0"
# 白名单，逗号分隔，路径中包含任一字符才通过，留空表示不限制
WHITE_LIST = ""

[observability]
enabled = true
